[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Opcional: plantilla de nombre para revisiones
# file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s
# sqlalchemy.url se define desde env.py usando la variable de entorno DATABASE_URL
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S